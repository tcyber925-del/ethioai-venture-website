name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Linting
        run: npm run lint

      - name: Type checking
        run: npm run typecheck

      - name: Build
        run: npm run build
