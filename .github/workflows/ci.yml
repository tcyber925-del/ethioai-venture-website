name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token for the check job (mirrors opencode-review.yml);
# the steps only read the checkout.
permissions:
  contents: read

jobs:
  checks:
    # Required status check on main ("Deterministic checks") — branch
    # protection references this job by name; renaming it would silently
    # un-gate merges (ENG-87).
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Linting
        run: npm run lint

      - name: Type checking
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Content schema validation
        run: npx astro sync

      - name: Build
        run: npm run build

      - name: Static accessibility, SEO and link checks
        run: npm run check:dist

      - name: SEO head contract checks
        run: npm run check:seo
