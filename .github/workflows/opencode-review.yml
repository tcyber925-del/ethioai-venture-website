name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Fork PRs get no secrets (and OIDC claims would not match), so only run
    # same-repo PRs — and only once they are out of draft.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # 15-min cap was raised to 25 when review rounds grew past it (two runs
    # killed at 15, `cancelled`, no comment posted). Steady-state rounds ran
    # ~12–14 min, so 25 looked like headroom.
    #
    # It was not, and the job log shows why: the agent requested an
    # `external_directory` permission for `/tmp/*`, whose default effect is
    # `ask`. This job is non-interactive, so nobody answers — the agent sat
    # blocked for 13.3 of the 25 minutes and was then killed by this timeout,
    # posting nothing. Two consecutive runs on PR #26 did exactly that; the run
    # that succeeded never touched /tmp at all.
    #
    # `anomalyco/opencode/github` exposes no permissions input, so the only
    # config lever is a repo-level opencode.json — which would apply to every
    # opencode session on this repo. Widening an advisory reviewer that is
    # explicitly read-only is the wrong trade for a scratch directory. The
    # prompt below instead tells it to stay inside the workspace, which removes
    # the prompt rather than pre-approving it. Raising this cap further would
    # only lengthen the stall; if it ever needs revisiting, raise it together
    # with a real answer for permission prompts.
    timeout-minutes: 25
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run OpenCode review
        # SHA-pinned (ENG-87) — `latest` peels to the github-vX action line;
        # Dependabot keeps this current.
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Review this pull request as an advisory reviewer: report findings only —
            do not edit code, push commits, or submit formal approvals.
            - Read AGENTS.md first and check the change against it: one issue = one
              PR, no invented claims or metrics, no unapproved dependencies or
              backend/database/CMS/auth, accessibility and semantic HTML preserved.
            - Check for code quality issues and potential bugs.
            - Cite file paths for each finding, ordered by severity. If nothing
              needs attention, say so briefly.
            - Work inside the checked-out repository only. If a command needs a
              temporary directory, point TMPDIR (and any npm cache) at a
              directory inside the workspace rather than using /tmp. Use the
              full invocation, not just TMPDIR — an npm cache left on the
              default path is both the same permission class and thousands of
              files in `git status`:
              `mkdir -p .tmp && TMPDIR=$PWD/.tmp npm_config_cache=$PWD/.tmp/npm npm test`
              (and the same prefix for `npm run verify`).
              Do NOT write to /tmp, /var/tmp, or any path outside the workspace.
              This job is non-interactive: a permission prompt for an external
              directory is never answered, so requesting one blocks until the
              job is killed. See the timeout note above.
              Running the suites is expected — `npm test` and `npm run verify`
              are the documented way to check a change, and TMPDIR is the only
              adjustment either needs. (Several suites build fixture
              directories under the system temp dir.)
